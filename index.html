<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MN Daily Items</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-choice">
  <h2>Login as</h2>
  <button id="customerBtn">Customer</button>
  <button id="adminBtn">Admin</button>
</div>

<!-- Customer login -->
<div id="customerLogin" style="display:none;">
  <h3>Customer Login</h3>
  <input type="text" id="customerPhone" placeholder="Enter phone number">
  <button id="customerLoginBtn">Login</button>
</div>

<!-- Admin login -->
<div id="adminLogin" style="display:none;">
  <h3>Admin Login</h3>
  <input type="text" id="adminUser" placeholder="Username">
  <input type="password" id="adminPass" placeholder="Password">
  <button id="adminLoginBtn">Login</button>
</div>

<!-- Customer products -->
<div id="customerPage" style="display:none;">
  <h2>Products</h2>
  <input type="text" id="searchInput" placeholder="Search products...">
  <div id="productsList"></div>
  <div id="checkout">
    <h3>Checkout</h3>
    <p>Payment Number: <span id="paymentNumber"></span></p>
    <p>Method: bKash / Nagad</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
