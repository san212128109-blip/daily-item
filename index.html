<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>misron — Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="brand"><div class="logo">M</div><div>MN Daily Items — Admin</div></div>
    <div class="top-actions">
      <a href="index.html" class="ghost">Store</a>
      <span class="pill small">Admin</span>
    </div>
  </header>

  <main class="container">
    <div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1;min-width:300px">
        <h3>Login</h3>
        <div class="small">Use default password <code>admin123</code> (change in code if you want)</div>
        <div class="form-row">
          <input id="adminPass" placeholder="Password">
          <button id="adminLogin" class="btn">Unlock</button>
        </div>

        <div id="adminArea" style="display:none;margin-top:12px">
          <h4>Payment Numbers</h4>
          <div class="form-row">
            <input id="bkashNum" placeholder="bKash number">
            <input id="nagadNum" placeholder="Nagad number">
          </div>
          <div style="display:flex;gap:8px;margin-bottom:12px">
            <button id="savePayment" class="primary">Save Payment</button>
            <button id="loadDefault" class="ghost">Load</button>
          </div>

          <h4>Sectors</h4>
          <div style="display:flex;gap:8px;margin-bottom:8px">
            <input id="newSector" placeholder="New sector name">
            <button id="addSector" class="primary">Add</button>
          </div>
          <div id="sectorsList" class="small"></div>

          <h4 style="margin-top:12px">Add Product (selected sector)</h4>
          <div class="form-row">
            <input id="prodTitle" placeholder="Title">
            <input id="prodPrice" placeholder="Price">
          </div>
          <div class="form-row">
            <textarea id="prodDesc" placeholder="Description"></textarea>
          </div>
          <div class="form-row">
            <input type="file" id="prodImage">
            <button id="addProductBtn" class="primary">Add Product</button>
          </div>

          <h4 style="margin-top:12px">Manage / Export</h4>
          <div style="display:flex;gap:8px;align-items:center">
            <button id="exportBtn" class="muted">Export JSON</button>
            <input type="file" id="importFile">
            <button id="resetBtn" class="danger">Reset All</button>
          </div>

          <div id="manageProducts" style="margin-top:12px"></div>
        </div>
      </div>

      <div style="width:360px;min-width:260px">
        <h3>Preview</h3>
        <div id="previewSectors" class="sectors" style="margin-bottom:12px"></div>
        <div id="previewProducts"></div>
      </div>
    </div>
  </main>

<script>
// reuse same storage key
const STORE_KEY = 'MISRON_STORE_v1';
const PAYMENT_KEY = 'MISRON_PAY_v1';
const ADMIN_PW = 'admin123';

// helpers
const $ = id => document.getElementById(id);
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function loadStore(){ const r=localStorage.getItem(STORE_KEY); return r?JSON.parse(r):{sectors:[]};}
function saveStore(s){ localStorage.setItem(STORE_KEY,JSON.stringify(s)); }
function loadPayment(){ const r=localStorage.getItem(PAYMENT_KEY); return r?JSON.parse(r):{bkash:'',nagad:''};}
function savePayment(p){ localStorage.setItem(PAYMENT_KEY,JSON.stringify(p));}

// UI
let store = loadStore();
let selectedSector = store.sectors[0]?.id || null;

function renderPreview(){
  const sEl = $('previewSectors'); sEl.innerHTML=''; store.sectors.forEach(s=>{
    const b=document.createElement('div'); b.className='sector'; b.textContent=s.name; b.onclick=()=>{ selectedSector=s.id; renderManage(); renderPreview(); };
    if(selectedSector===s.id) b.classList.add('active');
    sEl.appendChild(b);
  });
  renderPreviewProducts();
}
function renderPreviewProducts(){
  const p = $('previewProducts'); p.innerHTML='';
  const sec = store.sectors.find(x=>x.id===selectedSector);
  if(!sec) return;
  sec.products.forEach(prod=>{
    const d = document.createElement('div'); d.className='card'; d.style.marginBottom='8px';
    d.innerHTML = `<div class="thumb">${prod.image?'<img src="'+prod.image+'">':prod.title}</div><div class="title">${prod.title}</div><div class="price">৳${prod.price}</div>`;
    p.appendChild(d);
  });
}

function renderManage(){
  $('sectorsList').innerHTML=''; $('manageProducts').innerHTML='';
  store.sectors.forEach(s=>{
    const div=document.createElement('div'); div.style.display='flex'; div.style.gap='8px'; div.style.alignItems='center'; div.textContent = s.name;
    const btnR=document.createElement('button'); btnR.className='muted'; btnR.textContent='Rename'; btnR.onclick=()=>{
      const nn = prompt('New name', s.name); if(nn){ s.name = nn; saveStore(store); renderManage(); renderPreview(); }
    };
    const btnD=document.createElement('button'); btnD.className='danger'; btnD.textContent='Delete'; btnD.onclick=()=>{
      if(!confirm('Delete section and its products?')) return; store.sectors = store.sectors.filter(x=>x.id!==s.id); if(store.sectors.length===0) { alert('Add at least one sector'); }
      if(selectedSector===s.id) selectedSector = store.sectors[0]?.id || null; saveStore(store); renderManage(); renderPreview();
    };
    div.appendChild(btnR); div.appendChild(btnD); $('sectorsList').appendChild(div);
  });
  // products
  const sec = store.sectors.find(x=>x.id===selectedSector);
  if(sec){
    sec.products.forEach(p=>{
      const row = document.createElement('div'); row.style.display='flex'; row.style.gap='8px'; row.style.alignItems='center'; row.style.marginBottom='8px';
      row.innerHTML = `<div style="flex:1"><strong>${p.title}</strong><div class="small">৳${p.price}</div></div>`;
      const e = document.createElement('button'); e.className='muted'; e.textContent='Edit'; e.onclick=()=> editProduct(p.id);
      const d = document.createElement('button'); d.className='danger'; d.textContent='Delete'; d.onclick=()=>{ if(confirm('Delete?')){ sec.products = sec.products.filter(x=>x.id!==p.id); saveStore(store); renderManage(); renderPreview(); } };
      row.appendChild(e); row.appendChild(d); $('manageProducts').appendChild(row);
    });
  }
}

// initial render
function init(){
  if(!store.sectors || store.sectors.length===0){
    store = { sectors: [
      {id:'s1',name:'Staples',products:[]},
      {id:'s2',name:'Oils & Spices',products:[]},
      {id:'s3',name:'Beverages',products:[]},
      {id:'s4',name:'Snacks',products:[]},
      {id:'s5',name:'Household',products:[]}
    ]};
    saveStore(store);
  }
  renderPreview(); renderManage();
}
init();

// admin login
$('adminLogin').addEventListener('click',()=>{
  const pw = $('adminPass').value;
  if(pw !== ADMIN_PW) return alert('Wrong password');
  $('adminArea').style.display='block'; $('adminPass').value=''; alert('Admin unlocked');
  // load payment nums
  const p = loadPayment(); $('bkashNum').value = p.bkash || ''; $('nagadNum').value = p.nagad || '';
});

// add sector
$('addSector').addEventListener('click',()=>{
  const name = $('newSector').value.trim(); if(!name) return alert('Enter name');
  const id = uid(); store.sectors.push({id,name,products:[]}); saveStore(store); $('newSector').value=''; renderPreview(); renderManage();
});

// add product
$('addProductBtn').addEventListener('click', async ()=>{
  if(!selectedSector) return alert('Select sector');
  const sec = store.sectors.find(x=>x.id===selectedSector);
  const title = $('prodTitle').value.trim(); const price = Number($('prodPrice').value);
  const desc = $('prodDesc').value.trim();
  if(!title || !price) return alert('Provide title and price');
  const file = $('prodImage').files[0]; let dataUrl='';
  if(file){
    dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(); r.readAsDataURL(file); });
  }
  const p = { id: uid(), title, price, description: desc, image: dataUrl };
  sec.products.push(p); saveStore(store); $('prodTitle').value=''; $('prodPrice').value=''; $('prodDesc').value=''; $('prodImage').value=''; renderManage(); renderPreview();
});

// edit product
function editProduct(id){
  const sec = store.sectors.find(s=> s.products.find(p=>p.id===id));
  if(!sec) return;
  const prod = sec.products.find(p=>p.id===id);
  const newTitle = prompt('Title', prod.title); if(newTitle===null) return;
  const newPrice = prompt('Price', prod.price); if(newPrice===null) return;
  prod.title = newTitle; prod.price = Number(newPrice); saveStore(store); renderManage(); renderPreview();
}

// payment save/load
$('savePayment').addEventListener('click',()=>{
  const bk = $('bkashNum').value.trim(); const ng = $('nagadNum').value.trim();
  savePayment({bkash:bk,nagad:ng}); alert('Saved');
});
$('loadDefault').addEventListener('click',()=>{ const p=loadPayment(); $('bkashNum').value=p.bkash||''; $('nagadNum').value=p.nagad||''; });

// export / import
$('exportBtn').addEventListener('click',()=>{
  const blob = new Blob([JSON.stringify(store,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='misron_store.json'; a.click(); URL.revokeObjectURL(url);
});
$('importFile').addEventListener('change', async (ev)=>{ const f=ev.target.files[0]; if(!f) return; const txt = await f.text(); try{ const parsed = JSON.parse(txt); if(parsed.sectors){ store = parsed; saveStore(store); renderPreview(); renderManage(); alert('Imported'); } else alert('Invalid file'); }catch(e){ alert('Invalid JSON'); }});

// reset
$('resetBtn').addEventListener('click',()=>{ if(!confirm('Reset all?')) return; localStorage.removeItem(STORE_KEY); localStorage.removeItem(PAYMENT_KEY); init(); alert('Reset done'); });

</script>
</body>
</html>
